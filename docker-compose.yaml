services:
  postgres:
    image: postgres:16-alpine
    container_name: clinical-rag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: clinical_patients
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinical_patients"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: